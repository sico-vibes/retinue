[workspace]
resolver = "2"
members = [
  "crates/retinue-protocol",
  "crates/retinue-agent-core",
  "crates/retinue-storage",
  "crates/retinue-security",
  "crates/retinue-runtime",
  "crates/retinue-adapter-acp",
  "crates/retinue-adapter-codex",
  "crates/retinue-adapter-claude",
  "crates/retinue-adapter-opencode",
  "crates/retinue-usage",
  "crates/retinue-budget",
  "crates/retinue-process",
  "crates/retinue-wsl",
  "crates/retinue-speech",
  "crates/retinue-daemon",
  "apps/desktop/src-tauri",
  "tools/retinue-hook",
]

[workspace.package]
version = "0.1.0-beta.51"
edition = "2021"
license = "MIT"

[workspace.dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde", "clock"] }
chrono-tz = "0.10"
futures-util = "0.3"
hkdf = "0.12"
if-addrs = "0.15"
igd-next = { version = "0.18", default-features = false, features = ["aio_tokio"] }
p256 = { version = "0.13", features = ["ecdh", "pem"] }
rand = "0.9"
rcgen = "0.14"
regex = "1"
rusqlite = { version = "0.37", features = ["bundled", "chrono", "backup"] }
reqwest = { version = "0.12", features = ["json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-tungstenite = "0.27"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"
