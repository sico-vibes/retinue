[package]
name = "retinue-daemon"
version.workspace = true
edition.workspace = true

[[bin]]
name = "retinued"
path = "src/main.rs"

[dependencies]
aes-gcm.workspace = true
argon2.workspace = true
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
retinue-process = { path = "../retinue-process" }
retinue-protocol = { path = "../retinue-protocol" }
retinue-security = { path = "../retinue-security" }
retinue-storage = { path = "../retinue-storage" }
retinue-usage = { path = "../retinue-usage" }
retinue-runtime = { path = "../retinue-runtime" }
retinue-agent-core = { path = "../retinue-agent-core" }
retinue-adapter-acp = { path = "../retinue-adapter-acp" }
retinue-adapter-codex = { path = "../retinue-adapter-codex" }
retinue-adapter-claude = { path = "../retinue-adapter-claude" }
retinue-adapter-pi = { path = "../retinue-adapter-pi" }
chrono.workspace = true
futures-util.workspace = true
hkdf.workspace = true
hmac = "0.12"
if-addrs.workspace = true
p256.workspace = true
igd-next.workspace = true
rcgen.workspace = true
rustls.workspace = true
rustls-pemfile.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest = { workspace = true, features = ["rustls-tls"] }
webpki-roots = "1"
regex.workspace = true
rusqlite.workspace = true
rand.workspace = true
sha1 = "0.10"
sha2.workspace = true
subtle.workspace = true
zeroize.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
# The framed computer screen: its WebSocket half is a client here.
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
tracing.workspace = true
tracing-appender = "0.2"
tracing-subscriber.workspace = true
uuid.workspace = true
zip = { version = "2", default-features = false, features = ["deflate"] }
# 21 November 2026: npm publishes its platform binaries as `.tgz`, so a managed
# OpenCode copy is a gzip'd tar. `flate2` is already in the tree through `zip`.
flate2 = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(unix)'.dependencies]
# The host's own name for a Native certificate on a host with no `HOSTNAME`.
gethostname = "1"
# Free space on the data folder's volume (`statvfs`), the Linux half of
# `GetDiskFreeSpaceExW`; it keeps the backup and install-space guards real there.
libc = "0.2"

# 18 November 2026 (owner decision): on a Linux desktop with a running Secret
# Service keyring, values live there instead of in owner-only files. A pure-Rust
# client over zbus on the session socket, so the Linux CI job needs no libdbus
# headers; the `crypto-rust` half keeps OpenSSL out too. Windows never builds it.
[target.'cfg(not(windows))'.dependencies]
secret-service = { version = "=5.2.0", default-features = false, features = ["rt-async-io-crypto-rust"] }

[build-dependencies]
# Already in the tree through tauri-winres; it writes the version resource.
embed-resource = "3"
