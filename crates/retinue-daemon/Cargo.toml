[package]
name = "retinue-daemon"
version.workspace = true
edition.workspace = true

[[bin]]
name = "retinued"
path = "src/main.rs"

[dependencies]
aes-gcm.workspace = true
argon2.workspace = true
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
retinue-process = { path = "../retinue-process" }
retinue-protocol = { path = "../retinue-protocol" }
retinue-security = { path = "../retinue-security" }
retinue-storage = { path = "../retinue-storage" }
retinue-usage = { path = "../retinue-usage" }
retinue-runtime = { path = "../retinue-runtime" }
retinue-agent-core = { path = "../retinue-agent-core" }
retinue-adapter-acp = { path = "../retinue-adapter-acp" }
retinue-adapter-codex = { path = "../retinue-adapter-codex" }
retinue-adapter-claude = { path = "../retinue-adapter-claude" }
chrono.workspace = true
futures-util.workspace = true
hkdf.workspace = true
hmac = "0.12"
if-addrs.workspace = true
p256.workspace = true
igd-next.workspace = true
rcgen.workspace = true
rustls.workspace = true
rustls-pemfile.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest = { workspace = true, features = ["rustls-tls"] }
webpki-roots = "1"
regex.workspace = true
rusqlite.workspace = true
rand.workspace = true
sha2.workspace = true
subtle.workspace = true
zeroize.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tracing.workspace = true
tracing-appender = "0.2"
tracing-subscriber.workspace = true
uuid.workspace = true
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tokio-tungstenite.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_System_Diagnostics_ToolHelp"] }
