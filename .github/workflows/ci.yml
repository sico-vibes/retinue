name: CI

# The gates the Director runs by hand (`.claude/skills/retinue-development/references/verification.md`),
# on every push and pull request to main. No secrets are used and the token is read-only.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Some daemon tests overflow the default test-thread stack (verification.md).
  RUST_MIN_STACK: '33554432'
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  # Fast checks that need no toolchain: the import boundaries, the mechanical
  # formatting rules, the secret scan and the tests of those checks. Separate
  # from `gates` so a boundary or a committed key fails in a minute rather than
  # at the end of a ninety-minute job, and so a red `main` says which kind of
  # problem it is.
  hygiene:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The secret scan reads the history, and a pull request's own commits.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      # Every step below uses Node only: no `npm ci`, so a broken dependency
      # cannot hide a committed key.

      - name: Formatting and encoding
        run: node scripts/check-format.mjs

      - name: Import and dependency boundaries
        run: node scripts/check-architecture.mjs

      - name: Tests of the checks themselves
        run: node --test "scripts/**/*.test.mjs"

      - name: Install verified Gitleaks 8.30.1
        shell: pwsh
        run: |
          $tool = Join-Path $env:RUNNER_TEMP 'gitleaks'
          New-Item -ItemType Directory -Force -Path $tool | Out-Null
          $zip = Join-Path $tool 'gitleaks.zip'
          Invoke-WebRequest -Uri 'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_windows_x64.zip' -OutFile $zip
          # The digest published in gitleaks_8.30.1_checksums.txt, checked on 16 November 2026.
          $expected = 'd29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e'
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { Write-Host "::error::gitleaks zip digest $actual is not the published one"; exit 1 }
          Expand-Archive -Path $zip -DestinationPath $tool -Force
          "GITLEAKS_PATH=$tool\gitleaks.exe" >> $env:GITHUB_ENV

      - name: Prove the scanning exceptions still detect secrets
        run: node scripts/check-secret-config.mjs

      - name: Scan the commits this run adds
        shell: pwsh
        # A pull request scans its own commits; a push scans what it pushes.
        # With no base (the first push of a branch) it scans that commit alone:
        # `--all` does not finish on this history inside the timeout, and the
        # working-tree scan below covers everything that is here now. A
        # full-history scan belongs in a nightly run (`docs/plans/nod-adoption-plan.md`,
        # wave 3, "release safety").
        run: |
          $base = '${{ github.event.pull_request.base.sha }}'
          if (-not $base) { $base = '${{ github.event.before }}' }
          if ($base -and $base -ne '0000000000000000000000000000000000000000') {
            & $env:GITLEAKS_PATH git --config .gitleaks.toml --redact --no-banner --verbose --timeout 600 --max-target-megabytes 1 --log-opts="$base..HEAD" .
          } else {
            & $env:GITLEAKS_PATH git --config .gitleaks.toml --redact --no-banner --verbose --timeout 300 --max-target-megabytes 1 --log-opts=HEAD .
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Scan the checked-out files
        shell: pwsh
        run: |
          & $env:GITLEAKS_PATH dir --config .gitleaks.toml --redact --no-banner --verbose .
          if ($LASTEXITCODE -ne 0) { exit 1 }

  gates:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # The desktop crate is excluded below and cannot build from a path with
          # an apostrophe; nothing here needs it.
          workspaces: '.'

      # The runner's default temp folder uses a short name (RUNNER~1), and git reports the long one,
      # which many tests compare with.
      - name: Use a temp folder with a long name
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and mounted tests
        run: npm test

      - name: Daemon and crate tests
        shell: pwsh
        # Two tests are known flaky under load (verification.md). They are not
        # skipped: a failed run is retried once on its own, and any other failure,
        # or a second failure, still fails the build.
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'cargo-test.log'
          cargo test --workspace --exclude retinue-desktop --no-fail-fast 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -eq 0) { exit 0 }
          $flaky = @(
            'a_crash_after_a_finished_turn_does_not_fail_that_session',
            'stopping_a_turn_stops_its_setup_script'
          )
          $failed = @(Select-String -Path $log -Pattern '^test (\S+) \.\.\. FAILED' -CaseSensitive | ForEach-Object { $_.Matches[0].Groups[1].Value.Split('::')[-1] })
          Write-Host "failed tests: $($failed -join ', ')"
          $unexpected = @($failed | Where-Object { $flaky -notcontains $_ })
          if ($unexpected.Count -gt 0) {
            Write-Host "::error::failing tests not on the known-flaky list: $($unexpected -join ', ')"
            exit 1
          }
          foreach ($name in $failed) {
            Write-Host "retrying $name once"
            cargo test -p retinue-daemon $name -- --exact --nocapture
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::$name failed twice"
              exit 1
            }
          }

      - name: Clippy
        run: cargo clippy --workspace --exclude retinue-desktop --all-targets -- -D warnings

      - name: Build the production bundle
        run: npm run build

      - name: Build the phone PWA
        run: npm run build:remote --workspace @retinue/desktop

      - name: Documentation library
        run: npm run docs:check

      - name: Build the performance-gate binaries
        run: cargo build -p retinue-daemon --bin retinued -p retinue-storage --bin perf-seed

      - name: Performance gate
        run: npm run perf

      - name: Render budget
        run: npm run perf:render
