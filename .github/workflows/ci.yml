name: CI

# The gates the Director runs by hand (`.claude/skills/retinue-development/references/verification.md`),
# on every push and pull request to main, and nightly. No secrets are used and the token is read-only.
#
# One job per kind of check, selected by path (`scripts/ci-scope.mjs`, wave 3 of
# `docs/plans/nod-adoption-plan.md`, release safety; the design is
# `docs/research/n8n-nod/07-architecture.md` idea 4). `checks` is the one required job:
# it fails unless every check the `scope` job selected passed, so a wrong table
# runs less work, never less proof. The selection fails closed: a lockfile, a
# toolchain file, the workflow or the checks themselves, the native shell, or a
# path the table does not know runs everything.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The nightly run catches drift that no pull request touches: a dependency
  # registry, a runner image, a provider CLI. A schedule only runs on the
  # default branch, and it always runs every check.
  schedule:
    - cron: '10 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

# One group per ref *and* event (22 November 2026): with one group per ref, the
# nightly run cancelled the push run of the 0.2.0-beta.8 release commit, and
# the release's `require-ci` then judged that commit by the nightly run alone.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  # Some daemon tests overflow the default test-thread stack (verification.md).
  RUST_MIN_STACK: '33554432'
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  # Decides what changed, and so which checks run. Needs no toolchain: Node only,
  # so a selection bug is visible in about twenty seconds.
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      full: ${{ steps.select.outputs.full }}
      reason: ${{ steps.select.outputs.reason }}
      hygiene: ${{ steps.select.outputs.hygiene }}
      types: ${{ steps.select.outputs.types }}
      uiTests: ${{ steps.select.outputs.uiTests }}
      build: ${{ steps.select.outputs.build }}
      daemonTests: ${{ steps.select.outputs.daemonTests }}
      clippy: ${{ steps.select.outputs.clippy }}
      docs: ${{ steps.select.outputs.docs }}
      perf: ${{ steps.select.outputs.perf }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The base commit of a pull request, and a push's own commits, have to
          # be here to be diffed.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Decide which checks this change needs
        id: select
        shell: bash
        run: |
          set -u
          args=""
          # A scheduled or manual run, and the first push of a branch, have no
          # base to diff. Each runs everything rather than guessing.
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            args="--full"
          else
            base='${{ github.event.pull_request.base.sha }}'
            if [ -z "$base" ]; then base='${{ github.event.before }}'; fi
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
              args="--full"
            elif ! git diff --name-only --diff-filter=ACDMRTUXB "$base" "${{ github.sha }}" > changed.txt; then
              # A force-push leaves no base to compare with: run everything.
              args="--full"
            else
              args="--paths-file changed.txt"
            fi
          fi
          node scripts/ci-scope.mjs $args --github-output --summary --json

  # Fast checks that need no toolchain: the import boundaries, the mechanical
  # formatting rules, the secret scan and the tests of those checks. This job
  # always runs, so a boundary or a committed key fails in a minute rather than
  # at the end of a long run, and a red `main` says which kind of problem it is.
  hygiene:
    needs: scope
    if: needs.scope.outputs.hygiene == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The secret scan reads the history, and a pull request's own commits.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      # Every step below uses Node only: no `npm ci`, so a broken dependency
      # cannot hide a committed key.

      - name: Formatting and encoding
        run: node scripts/check-format.mjs

      - name: Import and dependency boundaries
        run: node scripts/check-architecture.mjs

      - name: Tests of the checks themselves
        run: node --test "scripts/**/*.test.mjs"

      - name: Install verified Gitleaks 8.30.1
        shell: pwsh
        run: |
          $tool = Join-Path $env:RUNNER_TEMP 'gitleaks'
          New-Item -ItemType Directory -Force -Path $tool | Out-Null
          $zip = Join-Path $tool 'gitleaks.zip'
          Invoke-WebRequest -Uri 'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_windows_x64.zip' -OutFile $zip
          # The digest published in gitleaks_8.30.1_checksums.txt, checked on 16 November 2026.
          $expected = 'd29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e'
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { Write-Host "::error::gitleaks zip digest $actual is not the published one"; exit 1 }
          Expand-Archive -Path $zip -DestinationPath $tool -Force
          "GITLEAKS_PATH=$tool\gitleaks.exe" >> $env:GITHUB_ENV

      - name: Prove the scanning exceptions still detect secrets
        run: node scripts/check-secret-config.mjs

      - name: Scan the commits this run adds
        shell: pwsh
        # A pull request scans its own commits; a push scans what it pushes.
        # With no base (the first push of a branch) it scans that commit alone:
        # `--all` does not finish on this history inside the timeout, and the
        # working-tree scan below covers everything that is here now. The
        # nightly run is the full-history scan.
        run: |
          $base = '${{ github.event.pull_request.base.sha }}'
          if (-not $base) { $base = '${{ github.event.before }}' }
          if ($base -and $base -ne '0000000000000000000000000000000000000000') {
            & $env:GITLEAKS_PATH git --config .gitleaks.toml --redact --no-banner --verbose --timeout 600 --max-target-megabytes 1 --log-opts="$base..HEAD" .
          } else {
            # The whole history from HEAD: 300 s ran out on 22 November 2026.
            & $env:GITLEAKS_PATH git --config .gitleaks.toml --redact --no-banner --verbose --timeout 900 --max-target-megabytes 1 --log-opts=HEAD .
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Scan the checked-out files
        shell: pwsh
        run: |
          & $env:GITLEAKS_PATH dir --config .gitleaks.toml --redact --no-banner --verbose .
          if ($LASTEXITCODE -ne 0) { exit 1 }

  types:
    needs: scope
    if: needs.scope.outputs.types == 'true'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  uiTests:
    needs: scope
    if: needs.scope.outputs.uiTests == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Unit and mounted tests
        run: npm test

  daemonTests:
    needs: scope
    if: needs.scope.outputs.daemonTests == 'true'
    runs-on: windows-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # The desktop crate is excluded below and cannot build from a path with
          # an apostrophe; nothing here needs it.
          workspaces: '.'

      # The runner's default temp folder uses a short name (RUNNER~1), and git reports the long one,
      # which many tests compare with.
      - name: Use a temp folder with a long name
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      - name: Daemon and crate tests
        shell: pwsh
        # Two tests are known flaky under load (verification.md). They are not
        # skipped: a failed run is retried once on its own, and any other failure,
        # or a second failure, still fails the build.
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'cargo-test.log'
          cargo test --workspace --exclude retinue-desktop --no-fail-fast 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -eq 0) { exit 0 }
          $flaky = @(
            'a_crash_after_a_finished_turn_does_not_fail_that_session',
            'stopping_a_turn_stops_its_setup_script'
          )
          $failed = @(Select-String -Path $log -Pattern '^test (\S+) \.\.\. FAILED' -CaseSensitive | ForEach-Object { $_.Matches[0].Groups[1].Value.Split('::')[-1] })
          Write-Host "failed tests: $($failed -join ', ')"
          $unexpected = @($failed | Where-Object { $flaky -notcontains $_ })
          if ($unexpected.Count -gt 0) {
            Write-Host "::error::failing tests not on the known-flaky list: $($unexpected -join ', ')"
            exit 1
          }
          foreach ($name in $failed) {
            Write-Host "retrying $name once"
            cargo test -p retinue-daemon $name -- --exact --nocapture
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::$name failed twice"
              exit 1
            }
          }

  clippy:
    needs: scope
    if: needs.scope.outputs.clippy == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: '.'

      - name: Clippy
        run: cargo clippy --workspace --exclude retinue-desktop --all-targets -- -D warnings

  build:
    needs: scope
    if: needs.scope.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build the production bundle
        run: npm run build

      - name: Build the phone PWA
        run: npm run build:remote --workspace @retinue/desktop

  docs:
    needs: scope
    if: needs.scope.outputs.docs == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Documentation library
        run: npm run docs:check

  # The two budgets need both binaries and the mounted UI, so they get their own
  # job rather than holding up the daemon tests.
  perf:
    needs: scope
    if: needs.scope.outputs.perf == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: '.'

      - name: Use a temp folder with a long name
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      - name: Install npm dependencies
        run: npm ci

      - name: Build the performance-gate binaries
        run: cargo build -p retinue-daemon --bin retinued -p retinue-storage --bin perf-seed

      - name: Performance gate
        run: npm run perf

      - name: Render budget
        run: npm run perf:render

  # The one required check, and the reason a path filter cannot let a change
  # through: it fails unless every check the scope job selected reported
  # success. A job that was not selected must be `skipped`; anything else
  # (a failure, a cancellation, a missing result) fails this job too.
  checks:
    name: checks
    needs: [scope, hygiene, types, uiTests, build, daemonTests, clippy, docs, perf, linux]
    if: always()
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Every selected check passed
        shell: pwsh
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          $needs = $env:NEEDS | ConvertFrom-Json
          if ($needs.scope.result -ne 'success') {
            Write-Host "::error::the scope job did not finish ($($needs.scope.result)); nothing can be certified"
            exit 1
          }
          $problems = @()
          foreach ($name in 'hygiene', 'types', 'uiTests', 'build', 'daemonTests', 'clippy', 'docs', 'perf', 'linux') {
            # The Linux daemon job runs whenever the Windows daemon tests do.
            $output = if ($name -eq 'linux') { 'daemonTests' } else { $name }
            $selected = $needs.scope.outputs.$output -eq 'true'
            $result = $needs.$name.result
            if ($selected -and $result -ne 'success') {
              $problems += "$name was selected and ended $result"
            } elseif (-not $selected -and $result -ne 'skipped') {
              # Unselected checks must be skipped. A success here means the job
              # ran without being asked for, which is a selection bug worth seeing.
              $problems += "$name was not selected but ended $result"
            }
          }
          if ($problems.Count -gt 0) {
            foreach ($problem in $problems) { Write-Host "::error::$problem" }
            exit 1
          }
          Write-Host "Every selected check passed ($($needs.scope.outputs.reason))."
  # 17 November 2026 (multi-device piece 8): the owner's VPS hosts sessions
  # headless on Linux, and nothing proved that `retinued` builds or passes its
  # tests there — this job does. It is the daemon crate and what it needs, not
  # the whole workspace: the desktop crate is Windows-only and the speech crate
  # downloads a large prebuilt engine that this host never runs.
  linux:
    needs: scope
    if: needs.scope.outputs.daemonTests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: '.'

      # rusqlite is built with `bundled` and rustls with `ring`, so the runner
      # needs a C compiler (and cmake, for ring's assembly) before a failure
      # here says anything about the code.
      - name: Build the C parts
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config cmake

      - name: Check the daemon and every crate it needs
        run: cargo check -p retinue-daemon --all-targets

      - name: Daemon tests
        # RUST_MIN_STACK comes from the workflow's env: some daemon tests
        # overflow the default test-thread stack.
        run: cargo test -p retinue-daemon --no-fail-fast

      - name: The two platform-shaped crates
        run: cargo test -p retinue-process

      - name: Clippy
        run: cargo clippy -p retinue-daemon --all-targets -- -D warnings

      - name: The headless binary links
        run: cargo build -p retinue-daemon --bin retinued
