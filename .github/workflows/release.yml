name: Release build

# Builds the Windows installer on a GitHub-hosted runner and, once SignPath is set up, has
# SignPath Foundation sign it (free signing for open-source projects). The Linux job builds
# the deb, AppImage and rpm from the same commit. The owner then publishes the downloaded
# installers with `scripts/release-windows.ps1` (plus `-SignedInstaller` for a signed Windows
# build and `-LinuxBundleDir` for the Linux folder), which adds the updater signatures
# locally. The updater key never enters CI (`docs/operations/linux-desktop.md`).
#
# Signing is two requests, each approved by the owner on signpath.io:
#   1. the app's own executables (the main window, the daemon and the hook), and
#   2. the installer built from those signed executables.
# Tauri writes a bundle-type marker into the main executable while bundling, which would
# break a signature made before it. So the marker is written first
# (`scripts/patch-bundle-type.mjs`) and bundling runs with `--no-binary-patching`.
#
# Setup: docs/operations/code-signing.md. Until the SIGNPATH_API_TOKEN secret exists the
# workflow still builds, and uploads the installer unsigned.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: release-build
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  # Refuses to build unless CI on this exact commit passed (wave 3,
  # `docs/plans/nod-adoption-plan.md`, release safety; the design is
  # `docs/research/n8n-nod/07-architecture.md` idea 7). A dispatch on a commit CI
  # never ran — a tag, a side branch, an old commit — is refused too: run CI on
  # the commit first, or release the commit CI built.
  require-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: CI on this commit must be green
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          runs=$(gh api "repos/$REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=50")
          passed=$(echo "$runs" | jq '[.workflow_runs[] | select(.conclusion == "success")] | length')
          failed=$(echo "$runs" | jq '[.workflow_runs[] | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out")] | length')
          total=$(echo "$runs" | jq '.workflow_runs | length')
          echo "CI runs on $SHA: $total total, $passed passed, $failed failed."
          if [ "$passed" -lt 1 ]; then
            echo "::error::CI has no successful run on $SHA ($total runs). Run CI on this commit first (Actions → CI → Run workflow on main), then release again."
            exit 1
          fi
          # The newest run is the one the owner is about to trust. An older green
          # run does not cover a commit that a later red run measured.
          newest=$(echo "$runs" | jq -r '.workflow_runs | sort_by(.created_at) | last | .conclusion')
          if [ "$newest" != "success" ]; then
            echo "::error::The newest CI run on $SHA ended $newest. Fix it and re-run CI before releasing."
            exit 1
          fi
          echo "CI is green on $SHA (newest run: $newest)."

  build:
    needs: require-ci
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      SIGNING: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Read the version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building Retinue $version"
          # The updater artifacts are made locally, where the updater key lives.
          # The release also ships the pinned computer-use driver beside the daemon (owner amendment,
          # 14 November 2026); only this build lists it, so local and CI builds don't need it.
          '{"bundle":{"createUpdaterArtifacts":false,"externalBin":["binaries/retinued","binaries/retinue-hook","binaries/open-computer-use"]}}' | Set-Content -Encoding utf8NoBOM (Join-Path $env:RUNNER_TEMP 'release.conf.json')

      - name: Build the daemon and the hook
        run: cargo build -p retinue-daemon --bin retinued -p retinue-hook --bin retinue-hook --release

      - name: Stage them beside the app
        run: node scripts/stage-daemon.mjs --release

      # `open-computer-use` 1.1.4 (MIT), fetched from its GitHub release and refused unless the zip
      # and the exe match the hashes pinned in the script (docs/operations/owner-computer-driver.md).
      - name: Fetch and check the computer-use driver
        shell: pwsh
        run: |
          $triple = (rustc -vV | Select-String '^host: (.+)$').Matches[0].Groups[1].Value
          $dir = Join-Path $env:RUNNER_TEMP 'owner-computer-driver'
          node scripts/fetch-owner-computer-driver.mjs --dest $dir
          if ($LASTEXITCODE -ne 0) {
            # Read-only: say whether Defender removed the driver (22 November 2026).
            Get-MpThreatDetection -ErrorAction SilentlyContinue | Select-Object -Last 5 ThreatID, ActionSuccess, InitialDetectionTime, @{n='Resources';e={$_.Resources -join '; '}} | Format-List | Out-String | Write-Host
            Get-MpThreat -ErrorAction SilentlyContinue | Select-Object -Last 5 ThreatName, SeverityID | Format-List | Out-String | Write-Host
            throw 'The computer-use driver could not be fetched and checked.'
          }
          Copy-Item (Join-Path $dir 'open-computer-use.exe') "apps/desktop/src-tauri/binaries/open-computer-use-$triple.exe" -Force

      - name: Build the app without bundling
        shell: pwsh
        working-directory: apps/desktop
        run: npx tauri build --no-bundle --config (Join-Path $env:RUNNER_TEMP 'release.conf.json')

      - name: Mark the main executable as the NSIS build
        run: node scripts/patch-bundle-type.mjs target/release/Retinue.exe nsis

      - name: Collect the executables to sign
        id: binaries
        shell: pwsh
        run: |
          $triple = (rustc -vV | Select-String '^host: (.+)$').Matches[0].Groups[1].Value
          $dir = Join-Path $env:RUNNER_TEMP 'unsigned-binaries'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item target/release/Retinue.exe $dir
          Copy-Item "apps/desktop/src-tauri/binaries/retinued-$triple.exe" (Join-Path $dir 'retinued.exe')
          Copy-Item "apps/desktop/src-tauri/binaries/retinue-hook-$triple.exe" (Join-Path $dir 'retinue-hook.exe')
          "triple=$triple" >> $env:GITHUB_OUTPUT
          "dir=$dir" >> $env:GITHUB_OUTPUT

      - name: Upload the executables for signing
        id: upload-binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-binaries
          path: ${{ steps.binaries.outputs.dir }}
          if-no-files-found: error
          retention-days: 3

      - name: Sign the executables (SignPath)
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: app-binaries
          github-artifact-id: ${{ steps.upload-binaries.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: ${{ runner.temp }}/signed-binaries

      - name: Put the signed executables back
        if: env.SIGNING == 'true'
        shell: pwsh
        run: |
          $signed = Join-Path $env:RUNNER_TEMP 'signed-binaries'
          $triple = '${{ steps.binaries.outputs.triple }}'
          Copy-Item (Join-Path $signed 'Retinue.exe') target/release/Retinue.exe -Force
          foreach ($name in 'retinued', 'retinue-hook') {
            Copy-Item (Join-Path $signed "$name.exe") "apps/desktop/src-tauri/binaries/$name-$triple.exe" -Force
            Copy-Item (Join-Path $signed "$name.exe") "target/release/$name.exe" -Force
          }
          foreach ($file in Get-ChildItem $signed -Filter *.exe) {
            $status = (Get-AuthenticodeSignature $file.FullName).Status
            Write-Host "$($file.Name): $status"
            if ($status -ne 'Valid') { throw "$($file.Name) is not validly signed ($status)." }
          }

      # The Microsoft Store package, from the same (signed, when SignPath is set up) executables.
      # The Store signs the package itself. Skipped until the Partner Center identity is set.
      - name: Pack the Microsoft Store package
        if: vars.MSIX_IDENTITY_NAME != ''
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
          RETINUE_VERSION: ${{ steps.version.outputs.version }}
          TRIPLE: ${{ steps.binaries.outputs.triple }}
        run: |
          ./packaging/msix/build-msix.ps1 `
            -AppExe target/release/Retinue.exe `
            -DaemonExe "apps/desktop/src-tauri/binaries/retinued-$env:TRIPLE.exe" `
            -HookExe "apps/desktop/src-tauri/binaries/retinue-hook-$env:TRIPLE.exe" `
            -RemoteWebDir apps/desktop/dist-remote `
            -Version $env:RETINUE_VERSION `
            -IdentityName $env:MSIX_IDENTITY_NAME `
            -Publisher $env:MSIX_PUBLISHER `
            -PublisherDisplayName $env:MSIX_PUBLISHER_DISPLAY_NAME `
            -OutDir (Join-Path $env:RUNNER_TEMP 'msix')
          Remove-Item -Recurse -Force (Join-Path $env:RUNNER_TEMP 'msix/layout')

      - name: Upload the Microsoft Store package
        if: vars.MSIX_IDENTITY_NAME != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: retinue-${{ steps.version.outputs.version }}-msix
          path: ${{ runner.temp }}/msix
          if-no-files-found: error
          retention-days: 30

      - name: Bundle the installer
        shell: pwsh
        working-directory: apps/desktop
        run: npx tauri bundle --bundles nsis --no-binary-patching --config (Join-Path $env:RUNNER_TEMP 'release.conf.json')

      - name: Collect the installer
        id: installer
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $found = @(Get-ChildItem target/release/bundle/nsis -Filter "*_${version}_*-setup.exe")
          if ($found.Count -ne 1) { throw "Expected one installer for $version, found $($found.Count)." }
          $dir = Join-Path $env:RUNNER_TEMP 'unsigned-installer'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item $found[0].FullName $dir
          "dir=$dir" >> $env:GITHUB_OUTPUT
          "name=$($found[0].Name)" >> $env:GITHUB_OUTPUT

      - name: Upload the installer for signing
        id: upload-installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-installer
          path: ${{ steps.installer.outputs.dir }}
          if-no-files-found: error
          retention-days: 3

      - name: Sign the installer (SignPath)
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: ${{ runner.temp }}/signed-installer

      - name: Check the installer and record its digest
        id: final
        shell: pwsh
        run: |
          $dir = if ($env:SIGNING -eq 'true') { Join-Path $env:RUNNER_TEMP 'signed-installer' } else { '${{ steps.installer.outputs.dir }}' }
          $file = Join-Path $dir '${{ steps.installer.outputs.name }}'
          $status = (Get-AuthenticodeSignature $file).Status
          Write-Host "Installer signature: $status"
          if ($env:SIGNING -eq 'true' -and $status -ne 'Valid') { throw "The installer is not validly signed ($status)." }
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ${{ steps.installer.outputs.name }}" | Set-Content -Encoding utf8NoBOM (Join-Path $dir 'SHA256SUMS.txt')
          "dir=$dir" >> $env:GITHUB_OUTPUT
          $label = if ($env:SIGNING -eq 'true') { 'signed' } else { 'UNSIGNED' }
          "### Retinue ${{ steps.version.outputs.version }} installer ($label)`n`nSHA-256: ``$hash``" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload the installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: retinue-${{ steps.version.outputs.version }}-installer
          path: ${{ steps.final.outputs.dir }}
          if-no-files-found: error
          retention-days: 30

  # Linux bundles. Built on 22.04 on purpose: the AppImage and the deb contain
  # binaries linked against the glibc of the machine that built them, and one
  # built on 24.04 (glibc 2.39) would refuse to start on 22.04, 23.04 and Debian
  # 12. 22.04 gives the 2.35 floor of the oldest release this port supports.
  #
  # No updater signing here: `createUpdaterArtifacts` is turned off for this
  # build, so the AppImage is produced unsigned and the owner makes and signs the
  # `.AppImage.tar.gz` updater archive locally with
  # `scripts/release-windows.ps1 -LinuxBundleDir`, where the updater key lives.
  linux:
    needs: require-ci
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: '.'

      # libwebkit2gtk-4.1 is Tauri 2's webview; the appindicator library is the
      # tray icon; patchelf lets the AppImage relink what it bundles.
      - name: Install the Linux build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Read the version
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building Retinue $version for Linux"

      - name: Leave the updater artifacts to the local signing step
        shell: bash
        run: echo '{"bundle":{"createUpdaterArtifacts":false}}' > "$RUNNER_TEMP/release.conf.json"

      - name: Build the daemon and the hook
        run: cargo build -p retinue-daemon --bin retinued -p retinue-hook --bin retinue-hook --release

      - name: Stage them beside the app
        run: node scripts/stage-daemon.mjs --release

      - name: Build the deb, AppImage and rpm
        working-directory: apps/desktop
        run: npx tauri build --bundles deb,appimage,rpm --config "$RUNNER_TEMP/release.conf.json"

      - name: Collect the bundles
        id: bundles
        shell: bash
        run: |
          set -eu
          dir="$RUNNER_TEMP/linux-bundles"
          mkdir -p "$dir"
          cp target/release/bundle/deb/*.deb "$dir"/
          cp target/release/bundle/appimage/*.AppImage "$dir"/
          cp target/release/bundle/rpm/*.rpm "$dir"/
          if [ "$(find "$dir" -maxdepth 1 -type f | wc -l)" -ne 3 ]; then
            echo "::error::Expected exactly one deb, one AppImage and one rpm."
            ls -l "$dir"
            exit 1
          fi
          ( cd "$dir" && sha256sum ./* > SHA256SUMS.txt )
          ls -l "$dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Upload the Linux bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: retinue-${{ steps.version.outputs.version }}-linux
          path: ${{ steps.bundles.outputs.dir }}
          if-no-files-found: error
          retention-days: 30
